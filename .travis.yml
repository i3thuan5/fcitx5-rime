---
os: linux
dist: jammy
language: minimal
services:
  - docker
branches:
  only:
    - main
before_install:
  - git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
jobs:
  include:
    - name: Build and verify .deb packages (Ubuntu 26.04)
      script:
        - ./packaging/build-all.sh
